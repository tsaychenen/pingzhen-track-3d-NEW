<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>平鎮車站 R05｜TK68+700–TK69+160 3D 軌道展示</title>
<meta name="description" content="平鎮車站 R05 Web 3D 軌道、光纖監測與里程互動展示" />
<style>
:root{--bg:#eaf0f5;--panel:rgba(255,255,255,.93);--ink:#122236;--muted:#66778a;--line:#d6e0e9;--blue:#1267a6;--blue2:#0d4f82;--shadow:0 16px 42px rgba(26,54,84,.15)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;outline:none}
#top{position:absolute;z-index:20;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(12px);pointer-events:auto}
.brand{border-radius:15px;padding:13px 15px;min-width:310px}.brand h1{font-size:16px;margin:0 0 4px}.brand p{font-size:11px;color:var(--muted);margin:0}.badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:99px;background:#e6f1fa;color:#145b90;font-size:10px}
.toolbar{border-radius:15px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(930px,calc(100vw - 335px))}
button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap}button:hover{transform:translateY(-1px);border-color:#9ebbd0}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.active{background:#e6f2fb;color:#0e5b94;border-color:#9dc7e6}
#side{position:absolute;z-index:18;right:16px;top:88px;width:255px;display:grid;gap:9px}.panel{border-radius:13px;padding:12px 13px}.panel h2{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0 0 8px}.selected{font-size:13px;font-weight:750;line-height:1.4;word-break:break-word}.meta{font-size:10px;color:var(--muted);line-height:1.6;margin-top:7px}
#tkbuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}#tkbuttons button{padding:7px}
#help{position:absolute;z-index:18;left:16px;bottom:14px;background:rgba(16,34,54,.84);color:white;border-radius:10px;padding:8px 11px;font-size:10px;line-height:1.5;backdrop-filter:blur(8px)}
#loading{position:absolute;z-index:60;inset:0;display:grid;place-items:center;background:linear-gradient(#f2f6f9,#e5edf4)}.loadbox{width:min(470px,80vw);text-align:center}.loadbox h2{font-size:17px;margin:0 0 5px}.loadbox p{font-size:11px;color:var(--muted);margin:0 0 13px}.bar{height:8px;background:#d4e0e9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s}.status{font-size:10px;color:var(--muted);margin-top:8px}
.tk{position:absolute;z-index:12;transform:translate(-50%,-100%);background:rgba(13,73,116,.92);color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:6px;padding:4px 6px;font-size:9px;font-weight:750;pointer-events:none;white-space:nowrap}.tk:after{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);border:4px solid transparent;border-top-color:rgba(13,73,116,.92);border-bottom:0}
#tour{display:none;position:absolute;z-index:22;bottom:17px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 11px;font-size:11px;font-weight:750}
@media(max-width:900px){#top{left:8px;right:8px;top:8px;display:block}.brand{min-width:0;margin-bottom:6px;padding:10px 11px}.toolbar{max-width:none}.brand h1{font-size:13px}#side{right:8px;top:auto;bottom:60px;width:215px}#help{left:8px;bottom:8px;max-width:calc(100vw - 235px)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
</head>
<body><div id="app">
<div id="loading"><div class="loadbox"><h2>正在載入平鎮車站 R05 3D 軌道模型</h2><p>TK68+700–TK69+160｜軌道・光纖・監測配置</p><div class="bar"><i id="bar"></i></div><div id="loadStatus" class="status">準備模型…</div></div></div>
<div id="top"><div class="brand card"><h1>平鎮車站｜3D 軌道展示 <span class="badge">R05</span></h1><p>TK68+700–TK69+160　業主互動檢視版</p></div><div class="toolbar card">
<button class="primary" data-view="all">全區總覽</button><button data-view="track">軌道焦點</button><button data-view="east">東正線</button><button data-view="west">西正線</button><button data-view="fiber">光纖配置</button><button data-view="office">公務所</button><button data-view="station">站體起點</button><button id="tourBtn">▶ 沿軌道導覽</button><button id="labelsBtn" class="active">TK 標示</button><button id="resetBtn">重設</button><button id="fsBtn">全螢幕</button>
</div></div>
<aside id="side"><section class="panel card"><h2>里程快速定位</h2><div id="tkbuttons"></div></section><section class="panel card"><h2>目前選取物件</h2><div id="selected" class="selected">點擊模型可查看名稱</div><div class="meta">R05 已加入光纖配置、公務所與站體起點等模型資訊。建議業主先用「沿軌道導覽」掌握整體，再點里程查看。</div></section></aside>
<div id="help">左鍵拖曳：旋轉　｜　滾輪：縮放　｜　右鍵拖曳：平移　｜　點模型：查看物件</div><div id="tour"></div><div id="labels"></div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const PARTS=["./model_part_01.glb", "./model_part_02.glb", "./model_part_03.glb", "./model_part_04.glb", "./model_part_05.glb", "./model_part_06.glb", "./model_part_07.glb", "./model_part_08.glb"];
const app=document.getElementById('app'), loading=document.getElementById('loading'), bar=document.getElementById('bar'), loadStatus=document.getElementById('loadStatus'), selected=document.getElementById('selected'), labelsLayer=document.getElementById('labels'), tourBox=document.getElementById('tour');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeaf0f5);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,10000);camera.position.set(120,90,120);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;app.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=true;controls.minDistance=.5;controls.maxDistance=5000;
scene.add(new THREE.HemisphereLight(0xffffff,0x71889b,2.0));const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(160,220,120);scene.add(sun);
const root=new THREE.Group();root.name='R05_MODEL_ROOT';scene.add(root);
const tkNames=['TK68+700','TK68+800','TK68+880','TK68+900','TK69+000','TK69+100','TK69+160'];let tkData=[],modelBox=null,modelSize=1,labelsVisible=true,cameraAnim=null,defaultPose=null,tourRunning=false,timer=null,dragging=false,dx=0,dy=0;
const loader=new GLTFLoader();
async function loadPart(url,i){return new Promise((resolve,reject)=>loader.load(url,g=>{root.add(g.scene);resolve()},undefined,reject));}
(async()=>{try{for(let i=0;i<PARTS.length;i++){loadStatus.textContent=`載入模型 ${i+1} / ${PARTS.length}`;await loadPart(PARTS[i],i);bar.style.width=`${((i+1)/PARTS.length)*100}%`;}root.updateMatrixWorld(true);modelBox=new THREE.Box3().setFromObject(root);modelSize=modelBox.getSize(new THREE.Vector3()).length();controls.maxDistance=modelSize*4;buildTK();fitBox(modelBox,1.18,new THREE.Vector3(.95,.65,1));setTimeout(()=>defaultPose={pos:camera.position.clone(),target:controls.target.clone()},1000);loading.style.display='none';}catch(e){console.error(e);loadStatus.textContent='模型載入失敗，請確認所有 model_part_XX.glb 與 index.html 位於同一資料夾。';loadStatus.style.color='#b23b3b';}})();
function objs(fn){const a=[];root.traverse(o=>{if(o.name&&fn(o.name,o))a.push(o)});return a}function boxObjs(a){const b=new THREE.Box3();a.forEach(o=>b.expandByObject(o));return b}function center(o){return new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3())}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}function animateCamera(p,t,d=850){cameraAnim={s:performance.now(),d,fp:camera.position.clone(),ft:controls.target.clone(),tp:p.clone(),tt:t.clone()}}
function fitBox(b,pad=1.25,dir=null){if(!b||b.isEmpty())return;const sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(sz.x,sz.y,sz.z),f=camera.fov*Math.PI/180;let dist=(m/2)/Math.tan(f/2)*pad;const v=(dir||new THREE.Vector3(1,.55,1)).clone().normalize();animateCamera(c.clone().add(v.multiplyScalar(Math.max(dist,modelSize*.08))),c,900)}
function focus(pred,pad=1.45){const a=objs(pred);if(a.length)fitBox(boxObjs(a),pad,new THREE.Vector3(.65,.4,1))}
function buildTK(){tkData=[];labelsLayer.innerHTML='';const wrap=document.getElementById('tkbuttons');wrap.innerHTML='';tkNames.forEach(n=>{const o=root.getObjectByName(n);if(!o)return;const d={name:n,obj:o,pos:center(o),el:document.createElement('div')};d.el.className='tk';d.el.textContent=n;labelsLayer.appendChild(d.el);tkData.push(d);const b=document.createElement('button');b.textContent=n;b.onclick=()=>{stopTour();focusTK(n)};wrap.appendChild(b)})}
function focusTK(n){const d=tkData.find(x=>x.name===n);if(!d)return;const i=tkData.indexOf(d),pr=tkData[Math.max(0,i-1)]?.pos||d.pos,nx=tkData[Math.min(tkData.length-1,i+1)]?.pos||d.pos,tan=nx.clone().sub(pr).normalize(),side=new THREE.Vector3(-tan.z,0,tan.x).normalize(),target=d.pos.clone().add(tan.clone().multiplyScalar(8)).add(new THREE.Vector3(0,1.2,0)),pos=d.pos.clone().add(tan.clone().multiplyScalar(-18)).add(side.multiplyScalar(5)).add(new THREE.Vector3(0,5.5,0));animateCamera(pos,target,900);selected.textContent=n}
function updateLabels(){const w=innerWidth,h=innerHeight,dir=new THREE.Vector3();camera.getWorldDirection(dir);tkData.forEach(d=>{if(!labelsVisible){d.el.style.display='none';return}const v=d.pos.clone(),toward=v.clone().sub(camera.position);if(dir.dot(toward)<=0){d.el.style.display='none';return}v.project(camera);if(v.z<-1||v.z>1||Math.abs(v.x)>1.15||Math.abs(v.y)>1.15){d.el.style.display='none';return}d.el.style.display='block';d.el.style.left=`${(v.x*.5+.5)*w}px`;d.el.style.top=`${(-v.y*.5+.5)*h}px`})}
function startTour(){if(tourRunning){stopTour();return}tourRunning=true;document.getElementById('tourBtn').textContent='■ 停止導覽';document.getElementById('tourBtn').classList.add('active');tourBox.style.display='block';let i=0;const step=()=>{if(!tourRunning)return;if(i>=tkData.length){stopTour();fitBox(modelBox,1.18,new THREE.Vector3(.95,.65,1));return}tourBox.textContent=`沿軌道導覽　${tkData[i].name}`;focusTK(tkData[i].name);i++;timer=setTimeout(step,2200)};step()}
function stopTour(){tourRunning=false;clearTimeout(timer);tourBox.style.display='none';const b=document.getElementById('tourBtn');b.textContent='▶ 沿軌道導覽';b.classList.remove('active')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{stopTour();const v=b.dataset.view;if(v==='all')fitBox(modelBox,1.18,new THREE.Vector3(.95,.65,1));if(v==='track')focus(n=>n.includes('鋼軌')||n.includes('軌頭')||n.includes('軌冠')||n.includes('混凝土枕木')||n.includes('道碴床'),1.2);if(v==='east')focus(n=>n.includes('東正線'));if(v==='west')focus(n=>n.includes('西正線'));if(v==='fiber')focus(n=>n.includes('應變纜')||n.includes('溫度纜')||n.includes('光纖'),1.25);if(v==='office')focus(n=>n.includes('公務所'),1.6);if(v==='station')focus(n=>n.includes('站體起點'),1.6)});
document.getElementById('tourBtn').onclick=startTour;document.getElementById('labelsBtn').onclick=()=>{labelsVisible=!labelsVisible;document.getElementById('labelsBtn').classList.toggle('active',labelsVisible)};document.getElementById('resetBtn').onclick=()=>{stopTour();if(defaultPose)animateCamera(defaultPose.pos,defaultPose.target,850)};document.getElementById('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();
renderer.domElement.addEventListener('pointerdown',e=>{dragging=false;dx=e.clientX;dy=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-dx,e.clientY-dy)>5)dragging=true});renderer.domElement.addEventListener('pointerup',e=>{if(dragging)return;const r=renderer.domElement.getBoundingClientRect(),m=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),ray=new THREE.Raycaster();ray.setFromCamera(m,camera);const h=ray.intersectObject(root,true);if(h.length){let o=h[0].object;while(o&&!o.name&&o.parent)o=o.parent;selected.textContent=o?.name||'未命名物件'}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function render(now){requestAnimationFrame(render);if(cameraAnim){const t=Math.min(1,(now-cameraAnim.s)/cameraAnim.d),k=ease(t);camera.position.lerpVectors(cameraAnim.fp,cameraAnim.tp,k);controls.target.lerpVectors(cameraAnim.ft,cameraAnim.tt,k);if(t>=1)cameraAnim=null}controls.update();updateLabels();renderer.render(scene,camera)}requestAnimationFrame(render);
</script></body></html>
